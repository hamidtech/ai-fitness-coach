name: Exercise Catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog-content/**'
      - '.github/workflows/exercise-catalog.yml'
  pull_request:
    paths:
      - 'catalog-content/**'
      - '.github/workflows/exercise-catalog.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the catalog and compare it with the previous version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          previous=()
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$BASE_SHA:catalog-content/pack.zip" 2>/dev/null; then
            git show "$BASE_SHA:catalog-content/pack.zip" > "$RUNNER_TEMP/previous-pack.zip"
            previous=(--previous "$RUNNER_TEMP/previous-pack.zip")
          fi
          python3 catalog-content/catalog_pack.py catalog-content/pack.zip "${previous[@]}"
