name: Android APK - Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle.kts
            android-app/gradle/libs.versions.toml
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve and inspect dependency graph
        run: |
          bash ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon > dependencies-compile.txt
          bash ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > dependencies-runtime.txt
          if grep -E -- '--- FAILED|Could not resolve' dependencies-compile.txt dependencies-runtime.txt; then
            echo 'Unresolved entries in the dependency report.'
            exit 1
          fi

      - name: Unit tests
        id: unit
        run: bash ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Summarize unit tests
        if: always()
        run: |
          python3 - <<'PYTESTS'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import os
          paths = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          keys = ("tests", "failures", "errors", "skipped")
          totals = dict.fromkeys(keys, 0)
          for path in paths:
              suite = ET.parse(path).getroot()
              for key in keys:
                  totals[key] += int(suite.attrib.get(key, 0))
          result = ", ".join(f"{name}={value}" for name, value in totals.items()) if paths else "No unit test reports"
          print(result)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("## Android unit tests\n\n" + result + "\n")
          PYTESTS

      - name: Build debug APK
        id: debug_apk
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-fitness-coach-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-reports
          path: |
            android-app/dependencies-compile.txt
            android-app/dependencies-runtime.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Android lint
        if: always() && steps.debug_apk.outcome == 'success'
        run: bash ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/test-results/
            android-app/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle.kts
            android-app/gradle/libs.versions.toml
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build instrumentation APK
        id: test_apk
        run: bash ./gradlew :app:assembleDebugAndroidTest --stacktrace --no-daemon

      - name: Instrumentation on Android emulator
        if: always() && steps.test_apk.outcome == 'success'
        timeout-minutes: 13
        run: |
          if [[ ! -e /dev/kvm ]]; then
            echo 'Instrumentation skipped because this runner has no KVM.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo chmod a+rw /dev/kvm
          sdkmanager --install 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/fitness-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd_path="$ANDROID_AVD_HOME/fitness-ci.avd"
          avdmanager create avd --name fitness-ci --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$avd_path" --force
          test -f "$avd_path/config.ini"
          sed -i '/^disk.dataPartition.size=/d' "$avd_path/config.ini"
          echo 'disk.dataPartition.size=3072M' >> "$avd_path/config.ini"
          if [[ ! -f "$ANDROID_AVD_HOME/fitness-ci.ini" ]]; then
            {
              echo 'avd.ini.encoding=UTF-8'
              echo "path=$avd_path"
              echo 'target=android-35'
            } > "$ANDROID_AVD_HOME/fitness-ci.ini"
          fi
          emulator_bin="$ANDROID_SDK_ROOT/emulator/emulator"
          test -x "$emulator_bin"
          "$emulator_bin" -list-avds | grep -Fx fitness-ci
          "$emulator_bin" -avd fitness-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill 2>/dev/null || kill "$emulator_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]]; then
              break
            fi
            sleep 2
          done
          if [[ "${attempt}" = 120 && "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]]; then
            cat emulator.log
            exit 1
          fi
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          bash ./gradlew :app:connectedDebugAndroidTest --stacktrace --no-daemon
          if ! python3 ci/capture-screens.py; then
            adb logcat -d -t 300 -s AndroidRuntime ActivityTaskManager > preview-logcat.txt
            echo 'Some screen captures could not be collected.'
          fi

      - name: Upload emulator results and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-results
          path: |
            android-app/app/build/reports/androidTests/
            android-app/app/build/outputs/androidTest-results/
            android-app/emulator.log
            android-app/preview-logcat.txt
            android-app/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
