name: Android APK - Build and Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android-app/**/*.gradle.kts
            android-app/gradle/libs.versions.toml
            android-app/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve and inspect dependency graph
        run: |
          bash ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon > dependencies-compile.txt
          bash ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon > dependencies-runtime.txt
          if grep -E -- '--- FAILED|Could not resolve' dependencies-compile.txt dependencies-runtime.txt; then
            echo 'Unresolved entries in the dependency report.'
            exit 1
          fi

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-fitness-coach-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload resolved dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-reports
          path: |
            android-app/dependencies-compile.txt
            android-app/dependencies-runtime.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
